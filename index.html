<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Shopping Store</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        #cartButton {
            background-color: white;
            color: #222;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        

        .container {
            width: 90%;
            margin: 40px auto;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product {
            background-color: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product h3 {
            margin: 15px 0 8px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .addBtn {
            background-color: #222;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .addBtn:hover {
            background-color: #444;
        }

        /* Cart */

        .cart {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background-color: white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
            padding: 25px;
            transition: 0.3s;
            overflow-y: auto;
        }

        .cart.active {
            right: 0;
        }

        .cart h2 {
            margin-bottom: 20px;
        }

        .cartItem {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .cartItem img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
        }

        .cartInfo {
            flex: 1;
        }

        .cartInfo h4 {
            margin-bottom: 5px;
        }

        .removeBtn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 8px;
            cursor: pointer;
            border-radius: 5px;
        }

        #total {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        #closeCart {
            float: right;
            background-color: red;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        

        @media(max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 500px) {
            .products {
                grid-template-columns: 1fr;
            }

            .cart {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    

    <header>

        <h1>My Store 🛍️</h1>

        <button id="cartButton">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>

    </header>



    <div class="container">

        <h2>Our Products</h2>

        <div class="products">

            

            <div class="product">

                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">

                <h3>Sports Shoes</h3>

                <p class="price">Rs. 5,000</p>

                <button class="addBtn"
                    onclick="addToCart('Sports Shoes', 5000, 'https://images.unsplash.com/photo-1542291026-7eec264c27ff')">

                    Add to Cart

                </button>

            </div>


            <!-- Product 2 -->

            <div class="product">

                <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62">

                <h3>Hand Bag</h3>

                <p class="price">Rs. 3,500</p>

                <button class="addBtn"
                    onclick="addToCart('Hand Bag', 3500, 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62')">

                    Add to Cart

                </button>

            </div>


            <!-- Product 3 -->

            <div class="product">

                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">

                <h3>Watch</h3>

                <p class="price">Rs. 7,000</p>

                <button class="addBtn"
                    onclick="addToCart('Watch', 7000, 'https://images.unsplash.com/photo-1523275335684-37898b6baf30')">

                    Add to Cart

                </button>

            </div>


            <!-- Product 4 -->

            <div class="product">

                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f">

                <h3>Camera</h3>

                <p class="price">Rs. 25,000</p>

                <button class="addBtn"
                    onclick="addToCart('Camera', 25000, 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f')">

                    Add to Cart

                </button>

            </div>

        </div>

    </div>


    <!-- Cart -->

    <div class="cart" id="cart">

        <button id="closeCart">X</button>

        <h2>🛒 My Cart</h2>

        <div id="cartItems"></div>

        <div id="total">
            Total: Rs. 0
        </div>

    </div>


    <!-- JavaScript -->

    <script>

        let cart = [];


        function addToCart(name, price, image) {

            let existingItem = cart.find(item => item.name === name);

            if (existingItem) {

                existingItem.quantity++;

            } else {

                cart.push({
                    name: name,
                    price: price,
                    image: image,
                    quantity: 1
                });

            }

            updateCart();

            document.getElementById("cart").classList.add("active");
        }


        function updateCart() {

            let cartItems = document.getElementById("cartItems");

            cartItems.innerHTML = "";

            let total = 0;
            let count = 0;


            cart.forEach((item, index) => {

                total += item.price * item.quantity;

                count += item.quantity;


                cartItems.innerHTML += `

                    <div class="cartItem">

                        <img src="${item.image}">

                        <div class="cartInfo">

                            <h4>${item.name}</h4>

                            <p>
                                Rs. ${item.price}
                                × ${item.quantity}
                            </p>

                        </div>

                        <button
                            class="removeBtn"
                            onclick="removeItem(${index})">

                            Remove

                        </button>

                    </div>

                `;

            });


            document.getElementById("cartCount").innerText = count;

            document.getElementById("total").innerText =
                "Total: Rs. " + total;

        }


        function removeItem(index) {

            cart.splice(index, 1);

            updateCart();

        }


        // Open Cart

        document.getElementById("cartButton").onclick = function() {

            document.getElementById("cart").classList.add("active");

        };


        // Close Cart

        document.getElementById("closeCart").onclick = function() {

            document.getElementById("cart").classList.remove("active");

        };

    </script>

</body>
</html>
